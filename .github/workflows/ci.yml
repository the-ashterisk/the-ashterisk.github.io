name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job name is the required status check in the "Protect main" ruleset —
  # renaming it means updating the ruleset too.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install`, not `npm ci` — same Rolldown/@emnapi lockfile drift as deploy.yml.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
